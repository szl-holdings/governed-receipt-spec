# Release-blocking CRITICAL gate for the szl-holdings estate.
#
# Rule (validated on the live org): a line matching
#     (?<!-)a11oy\.com
# is a violation UNLESS the same line is a prohibition/guard context, i.e. it
# also matches /(never|forbidden|not in|assertNotIn|does not appear|is not a
# surface|blocklist)/i — guard assertions, blocklists, and doctrine notes are
# legitimate. Canonical surfaces are a-11-oy.com (product) and a11oy.net
# (proof).
#
# Installed by the szl-alignment engine; keep in sync with
# alignment/templates/workflows/forbidden-domain.yml.
name: forbidden-domain

on:
  pull_request: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}

      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_REVISION"
          echo "exact source verified: $actual"

      - name: Scan for forbidden domain references
        shell: bash
        run: |
          set -euo pipefail
          # Evaluate exemptions on source content, before adding filename prefixes.
          if violations="$(rg -n --no-heading --hidden --color never -P '^(?!.*(?i:never|forbidden|not in|assertNotIn|does not appear|is not a surface|blocklist)).*(?<!-)a11oy\.com' --glob '!.git' .)"; then
            echo "::error::Forbidden domain references found (release-blocking CRITICAL)."
            echo "::error::Replace with a-11-oy.com or remove; guard contexts must say so on the same line."
            printf '%s\n' "$violations"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::UNKNOWN: forbidden-domain scan failed (exit $status); release blocked."
              exit "$status"
            fi
          fi
          echo "OK: no forbidden domain references outside guard contexts."
