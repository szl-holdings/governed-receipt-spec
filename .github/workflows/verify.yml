name: verify

on:
  push:
    branches:
    - main
  pull_request: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_REVISION"
          echo "exact source verified: $actual"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (v11 doctrine §7.1)
        run: pip install -r requirements.txt
      - name: Verify bound examples and reject the documented legacy gap
        run: |
          python verify.py \
            examples/a11oy-khipu-chain.json \
            examples/daily-activity-receipt.json \
            examples/readiness-audit-receipt.json
          if python verify.py examples/lake-inference-receipt.json; then
            echo "legacy clear-only lake claims unexpectedly passed" >&2
            exit 1
          fi
      - name: Cryptographically verify the shipped chain with the org public key
        run: >
          python verify.py --verify-key tests/fixtures/cosign.pub
          examples/a11oy-khipu-chain.json
      - name: Run the unittest suite
        run: python -m unittest discover -s tests -v
