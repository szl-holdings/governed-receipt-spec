# SPDX-License-Identifier: Apache-2.0
name: Public single-cell example

on:
  pull_request:
    paths:
      - 'examples/public-single-cell/**'
      - 'tests/test_public_single_cell.py'
      - 'verify.py'
      - 'schema/**'
      - 'requirements.txt'
      - '.github/workflows/public-single-cell.yml'
  push:
    branches: [main]
    paths:
      - 'examples/public-single-cell/**'
      - 'tests/test_public_single_cell.py'
      - 'verify.py'
      - 'schema/**'
      - 'requirements.txt'
      - '.github/workflows/public-single-cell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing pinned verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic input and artifact-binding regressions
        run: python -m unittest discover -s tests -p test_public_single_cell.py -v
      - name: Record actual checkout and resolved environment
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/single-cell-source.txt"
          python -m pip freeze > "$RUNNER_TEMP/single-cell-packages.txt"
      - name: Download exact public data, repeat calculation and exercise negative controls
        run: python examples/public-single-cell/run_example.py --output "$RUNNER_TEMP/single-cell-example"
      - name: Retain small outputs, not the source expression matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-single-cell-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/single-cell-example/*.json
            ${{ runner.temp }}/single-cell-example/*.txt
            ${{ runner.temp }}/single-cell-source.txt
            ${{ runner.temp }}/single-cell-packages.txt
          if-no-files-found: error
          retention-days: 30
      - name: Confirm tracked source remains unchanged
        run: git diff --exit-code
