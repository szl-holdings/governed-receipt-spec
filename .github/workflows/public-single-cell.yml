# SPDX-License-Identifier: Apache-2.0
name: Public single-cell example

on:
  pull_request:
    paths:
      - 'examples/public-single-cell/**'
      - 'tests/test_public_single_cell*.py'
      - 'verify.py'
      - 'schema/**'
      - 'requirements.txt'
      - '.github/workflows/public-single-cell.yml'
  push:
    branches: [main]
    paths:
      - 'examples/public-single-cell/**'
      - 'tests/test_public_single_cell*.py'
      - 'verify.py'
      - 'schema/**'
      - 'requirements.txt'
      - '.github/workflows/public-single-cell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing pinned verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Run input, artifact-binding and observed-record regressions
        run: python -m unittest discover -s tests -p 'test_public_single_cell*.py' -v
      - name: Record actual checkout and resolved environment
        run: |
          git rev-parse HEAD
          python -m pip freeze
      - name: Download exact public data, repeat calculation and exercise negative controls
        run: python examples/public-single-cell/run_example.py --output "$RUNNER_TEMP/single-cell-example"
      - name: Compare the actual recomputation with the recorded public example
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          recorded = json.loads(Path('examples/public-single-cell/observed-run.json').read_text())
          output = Path(os.environ['RUNNER_TEMP']) / 'single-cell-example'
          for name in ('summary', 'receipt'):
              current = json.loads((output / (name + '.json')).read_text())
              if current != recorded[name]:
                  raise SystemExit(name + ' differs from the retained real-data run')
          print('Fresh GEO calculation matches retained summary and receipt exactly.')
          PY
      # Only permitted checkout/setup-python actions are used. Keep the org's
      # action allowlist unchanged; logs/summary carry the small public evidence.
      - name: Preserve exact small evidence records in the run log and summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Public single-cell file verification'
            echo "Checkout: $(git rev-parse HEAD)"
            for name in summary.json receipt.json verification.json; do
              echo
              echo "### $name"
              echo '```json'
              cat "$RUNNER_TEMP/single-cell-example/$name"
              echo '```'
            done
            echo
            echo 'Unsigned file-integrity and repeatability evidence only. No biological validation.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Confirm tracked source remains unchanged
        run: git diff --exit-code
